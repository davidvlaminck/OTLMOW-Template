# Copy this file to .github/workflows/quality.yml to activate the gate.
#
# Rollout in two stages, otherwise the first run is red and the workflow gets
# disabled on day two:
#   1. ADVISORY   — keep `continue-on-error: true` on the lint/type steps for a
#                   few cycles so the report is published but nothing blocks.
#   2. ENFORCING  — remove `continue-on-error`. The ratchet (a lint count may not
#                   increase) is enforced from the start; the absolute zero-issue
#                   gate comes last, once the budget is actually zero.
#
# The workflow runs on the lowest supported Python version as well, because type
# and lint results differ per version.

name: Quality gate
run-name: Quality gate for ${{ github.sha }}
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  quality:
    name: Quality gate
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv with Python 3.9
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.9'

      - name: Install project dependencies
        run: |
          uv venv --python 3.9
          uv pip install -r pyproject.toml --extra test

      - name: Install quality tools
        # Pin ruff: a new release can introduce new findings and break the gate.
        # mypy must stay < 2: mypy 2.x refuses to target Python 3.9, which is the
        # minimum version this package supports.
        # Note: `uv sync` removes tools that are not in the lock file, so install
        # the quality tools explicitly instead of using uv sync.
        run: uv pip install ruff==0.17.0 "mypy<2" radon bandit vulture

      - name: Lint
        continue-on-error: true
        run: uv run ruff check otlmow_template UnitTests code_quality/scripts

      - name: Format check
        continue-on-error: true
        run: uv run ruff format --check otlmow_template UnitTests code_quality/scripts

      - name: Type check
        continue-on-error: true
        run: uv run mypy otlmow_template UnitTests code_quality/scripts

      - name: Tests and coverage
        env:
          COVERAGE_RCFILE: code_quality/coverage.cfg
        run: |
          uv run python -m pytest \
            --cov=otlmow_template \
            --cov-report=term \
            --cov-report=json:code_quality/reports/coverage.json \
            --cov-fail-under=80 \
            -q

      - name: Complexity
        # --fail-under makes radon exit 2; `-n C` only filters the output.
        continue-on-error: true
        run: uv run radon cc -s --fail-under 15 otlmow_template

      - name: Security
        continue-on-error: true
        run: uv run bandit -q -r otlmow_template

      - name: Dead code
        continue-on-error: true
        run: uv run vulture otlmow_template --min-confidence 80

      - name: CRAP ranking and change hot spots
        continue-on-error: true
        run: uv run python code_quality/scripts/crap_scores.py --source otlmow_template --top 25

      - name: QA report
        continue-on-error: true
        run: uv run python code_quality/scripts/qa_report.py --skip-tests

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ github.sha }}
          path: |
            code_quality/QA-REPORT.md
            code_quality/reports/
